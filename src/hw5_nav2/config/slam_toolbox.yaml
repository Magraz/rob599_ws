slam_toolbox:
  ros__parameters:
    use_sim_time: True
    mode: mapping

    # Frame and topic wiring for Stage + TurtleBot.
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    # 0.05 is the more stable default for online mapping.
    resolution: 0.05
    min_laser_range: 0.12
    max_laser_range: 3.5

    # Faster map refresh in simulation.
    map_update_interval: 1.0
    minimum_time_interval: 0.3
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.18

    # To resume mapping from a saved pose graph, uncomment below:
    # map_file_name: /path/to/saved_map  (no extension)
    # map_start_at_dock: true
